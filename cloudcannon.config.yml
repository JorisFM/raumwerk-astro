# CloudCannon-Konfiguration für die Raumwerk-Astro-Website.
# Dokumentation: https://cloudcannon.com/documentation/
#
# Die Inhalte liegen bewusst NICHT mehr fest in den .astro-Dateien, sondern in
# editierbaren Datenquellen:
#   - src/content/projekte/*.md  Projekte als Sammlung (Custom Post Type)
#   - src/data/site.json         globale Inhalte (Navigation, Footer, Kontakt)
#   - src/data/<seite>.json      Inhalt je Seite (Formular-Bearbeitung)
#   - src/legal/<seite>.md       Rechtstexte als Markdown (Content-/Rich-Text-Editor)
#
# Die .astro-Dateien sind reine Templates und tauchen daher nicht als
# bearbeitbarer Inhalt auf – deshalb verschwindet die WYSIWYG-Fehlermeldung.

# Wohin CloudCannon hochgeladene Dateien (z. B. Bilder) legt.
paths:
  uploads: public/uploads
  static: public

# Globale, seitenübergreifende Inhalte – erscheinen unter „Data".
data_config:
  site:
    path: src/data/site.json

# Bearbeitbare Sammlungen.
collections_config:
  # Projekte = Custom-Post-Type-artige Sammlung. Jede .md ist ein Projekt.
  # „Add" legt ein neues Projekt an (Vorlage: .cloudcannon/schemas/projekt.md);
  # Astro generiert daraus Übersicht (/projekte) und Detailseite (/projekte/<slug>).
  projekte:
    path: src/content/projekte
    name: Projekte
    icon: photo_library
    url: '/projekte/[slug]/'
    schemas:
      default:
        path: .cloudcannon/schemas/projekt.md
        name: Neues Projekt
    _enabled_editors:
      - content
    _inputs:
      category:
        type: text
        comment: z. B. „Privates Wohnen", „Gastronomie", „Hotellerie".
      location:
        type: text
        comment: Ort und Jahr, z. B. „Potsdam · 2024".
      year:
        type: text
      order:
        type: number
        comment: Sortierung in der Übersicht (kleiner = weiter oben).
      size:
        type: select
        options:
          values:
            - large
            - medium
            - small
            - full
        comment: Kachelgröße in der Übersicht.
      image:
        type: image
      image_alt:
        type: text
        comment: Bildbeschreibung für Barrierefreiheit/SEO.
      facts:
        type: array
        options:
          structures:
            values:
              - value:
                  label: ""
                  val: ""
      tags:
        type: array
  pages:
    path: src/data
    name: Seiten
    icon: description
    glob:
      - '*.json'
      - '!site.json'
    disable_add: true
    disable_add_folder: true
    # Output-URL je Seite (aus dem preview_url-Feld der jeweiligen JSON-Datei) –
    # nötig, damit der Visual Editor die richtige Seiten-Vorschau lädt.
    url: '{preview_url}'
    # Visual Editor (On-Page-WYSIWYG) via @cloudcannon/editable-regions.
    # Die Startseite (home.json) trägt bereits data-editable-Bindings.
    _enabled_editors:
      - visual
      - data
  legal:
    path: src/legal
    name: Rechtstexte
    icon: gavel
    glob:
      - '*.md'
    disable_add: true
    disable_add_folder: true
    disable_url: true
    _enabled_editors:
      - content
      - data

# Reihenfolge/Gruppierung in der Seitenleiste.
collection_groups:
  - heading: Inhalte
    collections:
      - projekte
      - pages
      - legal

# Mehrzeilige Felder als Textbereich statt einzeiligem Input darstellen.
_inputs:
  preview_url:
    type: hidden
    comment: Interne Vorschau-URL für den Visual Editor – nicht ändern.
  description:
    type: textarea
    comment: Meta-Description für Suchmaschinen.
  text:
    type: textarea
  sub:
    type: textarea
  lead:
    type: textarea
  answer:
    type: textarea
  note:
    type: textarea
  heading_html:
    type: text
    comment: Überschrift – <em>…</em> hebt kursiv hervor, <br> erzwingt Zeilenumbruch.
